  path_provider: ^2.1.1
  flutter_pdfview: ^1.4.3
  http: ^1.6.0
  uuid: ^4.5.2
  device_info_plus: ^12.2.0
  dotted_line: ^3.2.3
  carousel_slider: ^5.1.1
  shimmer: ^3.0.0
  file_picker: ^10.1.2
  collection: ^1.19.1
  no_screenshot: ^0.3.1
