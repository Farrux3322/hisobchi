  lottie: ^3.1.2
  pinput: ^4.0.0
  flutter_svg: ^2.0.10+1
  timer_count_down: ^2.2.2
  flutter_animator: ^3.2.2
  #  vibration: ^1.9.0
  mask_text_input_formatter: ^2.9.0
  loading_animation_widget: ^1.3.0
  fl_chart: ^0.69.0
  flutter_native_splash: ^2.4.6
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  photo_view: ^0.15.0
  smooth_page_indicator: ^1.2.1
  google_fonts: ^6.2.1
  flutter_sticky_header: ^0.7.0
  flutter_contacts: ^2.0.1


  flutter_bounce: ^1.1.0
  cached_network_image: ^3.4.1
  # Localization
  easy_localization: ^3.0.7

  # Networking
  dio: ^5.7.0
  crypto: ^3.0.6
  connectivity_plus: ^6.1.2

  # Models
  equatable: ^2.0.7

  # State management
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0

  # Local storage
  shared_preferences: ^2.3.5

  # Biometric authentication
  local_auth: ^3.0.0
  local_auth_android: ^2.0.4
  local_auth_darwin: ^2.0.1

  # Navigation
  go_router: ^14.6.3
  persistent_bottom_nav_bar_v2: ^5.3.1
  app_links: ^6.4.1
